name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vruizart-backend-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw test

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vruizart_deploy
          chmod 600 ~/.ssh/vruizart_deploy

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/vruizart_deploy \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'

          set -e

          cd ~/apps/vruizart-portfolio/backend

          git fetch origin
          git switch main
          git pull --ff-only origin main

          cd ~/apps/vruizart-portfolio

          docker compose build backend
          docker compose up -d backend

          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl --fail --silent --show-error \
            https://api.vruizart.com/api/public/profile > /dev/null