name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vruizart-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vruizart_deploy
          chmod 600 ~/.ssh/vruizart_deploy

          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Check SSH key fingerprint
        run: |
          ssh-keygen -lf ~/.ssh/vruizart_deploy

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/vruizart_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" \
            "echo SSH_OK"

      - name: Deploy backend
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh \
            -i ~/.ssh/vruizart_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" << 'EOF'

          set -e

          cd ~/apps/vruizart-portfolio/backend

          git fetch origin
          git switch main
          git pull --ff-only origin main

          cd ~/apps/vruizart-portfolio

          docker compose build backend
          docker compose up -d backend

          docker compose ps backend
          docker logs --tail=30 vruizart-portfolio-backend || true

          EOF

      - name: Verify deployment
        run: |
          echo "Waiting for backend..."

          for i in {1..12}; do
            echo "Attempt $i/12"

            if curl --fail --silent --show-error \
              https://api.vruizart.com/api/public/profile > /dev/null; then
              echo "Backend deployment OK"
              exit 0
            fi

            sleep 5
          done

          echo "Backend did not become available in time"
          exit 1