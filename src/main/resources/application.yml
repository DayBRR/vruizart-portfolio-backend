spring:
  application:
    name: vruizart-portfolio-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/vruizart_portfolio}
    username: ${DB_USERNAME:vruizart_user}
    password: ${DB_PASSWORD:change-me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
